<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        撮影ライブラリ | Baika Archery System
    </title>

    <link rel="stylesheet" href="css/foundation/tokens.css">

    <link rel="stylesheet" href="css/foundation/base.css">

    <link rel="stylesheet" href="css/layouts/app-layout.css">

    <link rel="stylesheet" href="css/components/header.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/v4.css">

    <link rel="stylesheet" href="css/v4-capture-library.css">
</head>

<body class="capture-library-page">

    <div id="app-header"></div>

    <main class="bas-app__main capture-library-main">

        <section class="capture-library-hero">

            <p class="capture-library-label">
                撮影センター
            </p>

            <h1>
                🗂️ 撮影ライブラリ
            </h1>

            <p class="capture-library-description">
                端末に保存した的写真やフォーム動画を確認します。
            </p>

        </section>

        <section class="capture-library-section">

            <h2>
                🎯 的写真
            </h2>

            <div id="targetPhotoLibraryList" class="capture-library-list capture-library-photo-list">
                読み込み中です…
            </div>

        </section>

        <section class="capture-library-section">

            <h2>
                🎥 フォーム動画
            </h2>

            <div id="formVideoLibraryList" class="capture-library-list">
                読み込み中です…
            </div>

        </section>

        <p class="capture-library-back">
            <a href="camera-center.html">
                ← 撮影センターへ戻る
            </a>
        </p>

    </main>

    <!-- 的写真 拡大表示 -->
    <div id="targetPhotoViewer" class="capture-library-photo-viewer" hidden>
        <div class="capture-library-photo-viewer__backdrop" data-photo-viewer-close></div>

        <div class="capture-library-photo-viewer__panel" role="dialog" aria-modal="true"
            aria-labelledby="targetPhotoViewerTitle">
            <div class="capture-library-photo-viewer__header">
                <div>
                    <h2 id="targetPhotoViewerTitle">
                        🎯 的写真
                    </h2>

                    <p id="targetPhotoViewerMeta">
                    </p>
                </div>

                <button type="button" id="targetPhotoViewerClose" class="capture-library-photo-viewer__close"
                    aria-label="写真を閉じる">
                    ✕
                </button>
            </div>

            <div class="capture-library-photo-viewer__image-wrap">
                <img id="targetPhotoViewerImage" alt="撮影した的写真">
            </div>
        </div>
    </div>

    <script src="js/core/organization.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/v4-capture-library.js"></script>

    <script>
        if (
            window.BAS_HEADER &&
            typeof window.BAS_HEADER.render === "function"
        ) {
            window.BAS_HEADER.render({
                currentRoute: "cameraCenter"
            });
        }
    </script>

</body>

</html>
