<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        撮影ライブラリ | Baika Archery System
    </title>

    <link rel="stylesheet" href="css/foundation/tokens.css">

    <link rel="stylesheet" href="css/foundation/base.css">

    <link rel="stylesheet" href="css/layouts/app-layout.css">

    <link rel="stylesheet" href="css/components/header.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/v4.css">

    <link rel="stylesheet" href="css/v4-capture-library.css">
</head>

<body class="capture-library-page">

    <div id="app-header"></div>

    <main class="bas-app__main capture-library-main">

        <section class="capture-library-hero">

            <p class="capture-library-label">
                撮影センター
            </p>

            <h1>
                🗂️ 撮影ライブラリ
            </h1>

            <p class="capture-library-description">
                端末に保存した的写真やフォーム動画を確認します。
            </p>

        </section>

        <section class="capture-library-section">

            <div class="capture-library-photo-heading">

                <h2>
                    🎯 的写真
                </h2>

                <div class="capture-library-photo-import">

                    <button type="button" id="targetPhotoSelectButton" class="capture-library-photo-import__button">
                        ☑ 写真を選択
                    </button>

                    <button type="button" id="targetPhotoImportButton" class="capture-library-photo-import__button">
                        ＋ 写真を取り込む
                    </button>

                    <input type="file" id="targetPhotoImportInput" accept="image/*,application/json,.json" multiple
                        hidden>

                </div>

            </div>

            <div id="targetPhotoSelectionBar" class="capture-library-photo-selection-bar" hidden>
                <span id="targetPhotoSelectionCount">
                    0枚選択中
                </span>

                <div class="capture-library-photo-selection-actions">

                    <button type="button" id="targetPhotoSelectAllButton"
                        class="capture-library-photo-selection-button">
                        すべて選択
                    </button>

                    <button type="button" id="targetPhotoShareButton"
                        class="capture-library-photo-selection-button capture-library-photo-selection-button--primary"
                        disabled>
                        📤 選択した写真を共有
                    </button>

                </div>
            </div>

            <div id="targetPhotoLibraryList" class="capture-library-list capture-library-photo-list">
                読み込み中です…
            </div>

        </section>

        <section class="capture-library-section">

            <h2>
                🎥 フォーム動画
            </h2>

            <div id="formVideoLibraryList" class="capture-library-list">
                読み込み中です…
            </div>

        </section>

        <p class="capture-library-back">
            <a href="camera-center.html">
                ← 撮影センターへ戻る
            </a>
        </p>

    </main>

    <!-- 的写真 拡大表示 -->

    <div id="targetPhotoImportViewer" class="capture-library-photo-viewer" hidden>
        <div class="capture-library-photo-viewer__backdrop" data-photo-import-close></div>

        <div class="capture-library-photo-viewer__panel" role="dialog" aria-modal="true"
            aria-labelledby="targetPhotoImportTitle">
            <div class="capture-library-photo-viewer__header">

                <div>
                    <h2 id="targetPhotoImportTitle">
                        ＋ 写真を取り込む
                    </h2>

                    <p id="targetPhotoImportCount">
                        選択した写真を確認しています。
                    </p>
                </div>

                <button type="button" id="targetPhotoImportClose" class="capture-library-photo-viewer__close"
                    aria-label="取り込み画面を閉じる">
                    ✕
                </button>

            </div>

            <div class="capture-library-photo-viewer__gallery">

                <button type="button" id="targetPhotoImportPrev" class="capture-library-photo-viewer__nav"
                    aria-label="前の取り込み写真を表示">
                    ←
                </button>

                <div class="capture-library-photo-viewer__image-wrap">
                    <img id="targetPhotoImportPreview" alt="取り込む的写真">
                </div>

                <button type="button" id="targetPhotoImportNext" class="capture-library-photo-viewer__nav"
                    aria-label="次の取り込み写真を表示">
                    →
                </button>

            </div>

            <div class="capture-library-photo-import__conditions">

                <p class="capture-library-photo-import__conditions-note">
                    選択した写真すべてに共通の撮影情報を設定できます。
                </p>

                <label>
                    距離

                    <select id="targetPhotoImportDistance">
                        <option value="">未入力</option>
                        <option value="18m">18m</option>
                        <option value="30m">30m</option>
                        <option value="50m">50m</option>
                        <option value="60m">60m</option>
                        <option value="70m">70m</option>
                    </select>
                </label>

                <label>
                    天気

                    <select id="targetPhotoImportWeather">
                        <option value="">未入力</option>
                        <option value="sunny">晴れ</option>
                        <option value="cloudy">曇り</option>
                        <option value="rainy">雨</option>
                        <option value="snowy">雪</option>
                        <option value="other">その他</option>
                    </select>
                </label>

                <label>
                    風の強さ

                    <select id="targetPhotoImportWindStrength">
                        <option value="">未入力</option>
                        <option value="none">無風</option>
                        <option value="weak">弱い</option>
                        <option value="normal">普通</option>
                        <option value="strong">強い</option>
                    </select>
                </label>

                <label>
                    風向

                    <select id="targetPhotoImportWindDirection">
                        <option value="">未入力</option>
                        <option value="north-west">右手前 → 左奥</option>
                        <option value="north">手前 → 奥</option>
                        <option value="north-east">左手前 → 右奥</option>
                        <option value="west">右 → 左</option>
                        <option value="east">左 → 右</option>
                        <option value="south-west">右奥 → 左手前</option>
                        <option value="south">奥 → 手前</option>
                        <option value="south-east">左奥 → 右手前</option>
                    </select>
                </label>

            </div>

            <div class="capture-library-photo-viewer__actions">

                <button type="button" id="targetPhotoImportSave" class="capture-library-photo-import__save">
                    📥 選択した写真をまとめて取り込む
                </button>

            </div>

        </div>
    </div>

    <div id="targetPhotoViewer" class="capture-library-photo-viewer" hidden>
        <div class="capture-library-photo-viewer__backdrop" data-photo-viewer-close></div>

        <div class="capture-library-photo-viewer__panel" role="dialog" aria-modal="true"
            aria-labelledby="targetPhotoViewerTitle">
            <div class="capture-library-photo-viewer__header">
                <div>
                    <h2 id="targetPhotoViewerTitle">
                        🎯 的写真
                    </h2>

                    <p id="targetPhotoViewerMeta">
                    </p>
                </div>

                <button type="button" id="targetPhotoViewerClose" class="capture-library-photo-viewer__close"
                    aria-label="写真を閉じる">
                    ✕
                </button>
            </div>

            <div class="capture-library-photo-viewer__gallery">

                <button type="button" id="targetPhotoViewerPrev" class="capture-library-photo-viewer__nav"
                    aria-label="前の写真を表示">
                    ←
                </button>

                <div class="capture-library-photo-viewer__image-wrap">
                    <img id="targetPhotoViewerImage" alt="撮影した的写真">
                </div>

                <button type="button" id="targetPhotoViewerNext" class="capture-library-photo-viewer__nav"
                    aria-label="次の写真を表示">
                    →
                </button>

            </div>

            <div class="capture-library-photo-viewer__actions">

                <button type="button" id="targetPhotoViewerDelete" class="capture-library-photo-viewer__delete">
                    🗑️ この写真を削除
                </button>

            </div>

        </div>
    </div>

    <script src="js/core/organization.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/v4-capture-library.js"></script>

    <script>
        if (
            window.BAS_HEADER &&
            typeof window.BAS_HEADER.render === "function"
        ) {
            window.BAS_HEADER.render({
                currentRoute: "cameraCenter"
            });
        }
    </script>

</body>

</html>
