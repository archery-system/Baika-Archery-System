<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
        Baika Archery System
    </title>

    <meta
        name="theme-color"
        content="#9b2457"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="icons/favicon-32.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="icons/apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <link rel="stylesheet" href="css/foundation/tokens.css">
    <link rel="stylesheet" href="css/foundation/base.css">
    <link rel="stylesheet" href="css/layouts/app-layout.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/page-header.css">
    <link rel="stylesheet" href="css/components/card.css">
    <link rel="stylesheet" href="css/components/ai-dashboard.css">
    <link rel="stylesheet" href="css/components/ai-coach.css">
    <link rel="stylesheet" href="css/pages/home.css">
</head>

<body>

    <div class="bas-app">

        <div id="app-header"></div>

        <main class="bas-app__main">

            <div id="page-header"></div>

            <div class="bas-home">

                <section class="bas-card">

                    <div class="bas-home__welcome">

                        <div class="bas-home__user">

                            <p class="bas-home__label">
                                ログイン中
                            </p>

                            <h2 id="homeUserName" class="bas-home__name">
                                ゲストユーザー
                            </h2>

                            <p id="homeGreeting" class="bas-home__greeting">
                                こんばんは
                            </p>

                            <p class="bas-home__message">
                                今日も練習の記録と振り返りで成長へ

                            </p>

                        </div>

                    </div>

                    <div class="bas-home__last-practice">

                        <div class="bas-home__last-practice-header">

                            <div>
                                <p class="bas-home__last-practice-label">
                                    前回の練習
                                </p>

                                <p id="homeLastPracticeDate" class="bas-home__last-practice-date">
                                    2026年7月20日
                                </p>
                            </div>

                            <span id="homeLastPracticeDistance" class="bas-home__distance-badge">
                                70m
                            </span>

                        </div>

                        <div class="bas-home__stats">

                            <div class="bas-home__stat">

                                <span class="bas-home__stat-label">
                                    総得点
                                </span>

                                <strong id="homeLastPracticeScore" class="bas-home__stat-value">
                                    －
                                </strong>

                                <span class="bas-home__stat-unit">
                                    点
                                </span>

                            </div>

                            <div class="bas-home__stat">

                                <span class="bas-home__stat-label">
                                    平均
                                </span>

                                <strong id="homeLastPracticeAverage" class="bas-home__stat-value">
                                    －
                                </strong>

                                <span class="bas-home__stat-unit">
                                    点
                                </span>

                            </div>

                            <div class="bas-home__stat">

                                <span class="bas-home__stat-label">
                                    射数
                                </span>

                                <strong id="homeLastPracticeArrowCount" class="bas-home__stat-value">
                                    －
                                </strong>

                                <span class="bas-home__stat-unit">
                                    射
                                </span>

                            </div>

                        </div>

                    </div>

            </div>

            <section class="bas-home__dashboard">

                <div class="bas-home__dashboard-card">

                    <h3 class="bas-home__dashboard-title">
                        📝 前回のメモ
                    </h3>

                    <p id="homeLastMemo" class="bas-home__dashboard-text">
                        クリックで力みが出た。
                        後半は肩の位置を意識するとグルーピングが改善した。
                    </p>

                </div>

                <section class="bas-home-section">
                    <div id="home-ai-dashboard"></div>
                </section>

                <section class="bas-home-section">
                    <div id="home-ai-coach"></div>
                </section>

                <div id="home-today-practice" class="bas-home__dashboard-card">

                    <h3 class="bas-home__dashboard-title">
                        🎯 今日の目標
                    </h3>

                    <ul id="homeTodayGoals" class="bas-home__goal-list">

                        <li>□ リリースを丁寧に</li>

                        <li>□ 左肩を下げない</li>

                        <li>□ 70m 660点以上</li>

                    </ul>

                </div>

            </section>

            </section>

            <section class="bas-home__section">

                <h2 class="bas-home__section-title">

                    メニュー

                </h2>

                <div id="homeFeatureCards" class="bas-home__grid">

                </div>

            </section>

    </div>

    </main>

    </div>

    <!-- Login Session -->
    <script src="js/v4-session.js"></script>
    <script src="js/auth/api.js"></script>

    <!-- Project Zero Core -->
    <script src="js/core/config.js"></script>
    <script src="js/core/organization.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/cloud.js?v=1"></script>

    <!-- Project Zero Components -->
    <script src="js/components/header.js"></script>
    <script src="js/components/page-header.js"></script>
    <script src="js/components/card.js"></script>
    <script src="js/components/dashboard.js?v=2"></script>
    <script src="js/components/today-practice.js"></script>
    <script src="js/core/trend-analyzer.js"></script>
    <script src="js/components/ai-dashboard.js"></script>
    <script src="js/core/ai-engine.js"></script>
    <script src="js/components/ai-coach.js"></script>

    <!-- Project Zero Pages -->
    <script src="js/pages/home.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (
                !window.V4Session ||
                typeof window.V4Session.requireLogin !== "function" ||
                !window.V4Session.requireLogin()
            ) {
                return;
            }

            if (
                window.BAS_HEADER &&
                typeof window.BAS_HEADER.render === "function"
            ) {
                window.BAS_HEADER.render({
                    currentRoute: "home"
                });
            }

            if (
                window.BAS_HOME &&
                typeof window.BAS_HOME.initialize === "function"
            ) {
                window.BAS_HOME.initialize();
            }
        });
    </script>

</body>

</html>
