<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#24113f">

    <title>
        AI解析 | Baika Archery System
    </title>

    <!-- Project Zero 共通デザイン -->
    <link rel="stylesheet" href="css/foundation/tokens.css">

    <link rel="stylesheet" href="css/foundation/base.css">

    <link rel="stylesheet" href="css/layouts/app-layout.css">

    <link rel="stylesheet" href="css/components/header.css">

    <!-- Ver4 共通デザイン -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/v4.css">
</head>

<body>

    <!-- Project Zero 共通ヘッダー -->
    <div id="app-header"></div>

    <main style="
            width: min(100% - 32px, 900px);
            margin: 0 auto;
            padding-top: calc(var(--bas-header-height) + 32px);
            padding-bottom: 32px;
        ">

        <section style="
                padding: 24px;
                border-radius: 20px;
                background: #fff;
                box-shadow: 0 8px 24px rgba(36, 17, 63, 0.10);
            ">

            <p style="
                    margin: 0 0 8px;
                    color: #6b5b7d;
                    font-weight: 700;
                ">
                撮影・確認・解析
            </p>

            <h1 style="
                    margin: 0 0 12px;
                    color: #351c57;
                ">
                ✨ AI解析
            </h1>

            <p style="
                    margin-bottom: 16px;
                    line-height: 1.8;
                    color: #625b6b;
                ">
                撮影ライブラリに保存されたフォーム動画を選択して、
                射形をAIで評価できるようにします。
            </p>

            <div id="aiFormVideoList" style="
                    display: grid;
                    gap: 16px;
                ">
                フォーム動画を読み込んでいます…
            </div>

            <div id="aiFormVideoAnalysisArea" style="
                    display: none;
                    margin-top: 20px;
                    padding: 20px;
                    border: 1px solid rgba(79, 38, 131, 0.16);
                    border-radius: 16px;
                    background: rgba(79, 38, 131, 0.05);
                ">
                <h3 style="
                        margin: 0 0 12px;
                        color: #351c57;
                    ">
                    🤖 AI評価
                </h3>

                <div id="aiFormVideoFramePreview"></div>

                <div id="aiFormVideoResult" style="
                        margin-top: 16px;
                        line-height: 1.8;
                        color: #351c57;
                    "></div>
            </div>

        </section>

        <section style="
                margin-top: 20px;
                padding: 24px;
                border-radius: 20px;
                
    </main>

    <script src="js/core/config.js"></script>
    <script src="js/core/organization.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/v4-ai-analysis.js"></script>

    <script>
        if (
            window.BAS_HEADER &&
            typeof window.BAS_HEADER.render ===
            "function"
        ) {
            window.BAS_HEADER.render({
                currentRoute:
                    "cameraCenter"
            });
        }
    </script>

</body>

</html>
